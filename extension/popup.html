<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>chordsで開く</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">ギターコード一覧</p>
      <h1>chordsで開く</h1>
      <p id="song-title" class="song-title"></p>
      <p id="status" role="status">現在の曲を確認しています…</p>
      <a id="song-link" class="primary" role="link" aria-disabled="true" target="_blank" rel="noopener noreferrer">この曲をchordsで開く ↗</a>
      <button id="refresh" type="button">曲を再確認</button>
      <a class="home" href="https://chords.kani3camp.com/" target="_blank" rel="noopener noreferrer">chordsトップを開く ↗</a>
    </main>
  </body>
</html>
