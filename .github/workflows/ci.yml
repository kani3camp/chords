name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:catalog
      - run: pnpm catalog:diff
      - run: pnpm test:url-compat
      - run: pnpm measure:url
      - run: pnpm build
      - name: Validate Cloudflare deployment configuration without deploying
        run: pnpm deploy:check
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
      - run: pnpm exec playwright install --with-deps chromium webkit msedge
      - name: Verify OGP HTTP responses in the local Workers runtime
        run: pnpm test:ogp
      - run: pnpm test:e2e --workers 2
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          include-hidden-files: true
          path: |
            playwright-report/
            docs/screenshots/
            docs/coverage.json
            docs/url-measurements.json
            .cache/ogp-report.json
          retention-days: 14

  production-ogp:
    name: Production OGP smoke after deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Cloudflare deployed real Japanese song card PNG
        run: node scripts/check-production-og-image.mjs
